name: Newsletter to blog (auto-publish)

# Auto-publisher: for every SENT "Darice on AI" issue that has no post yet, it
# parses the issue, builds the post and its four section-image cards, and
# commits them straight to main. GitHub Pages then rebuilds and the post goes
# live. This runs hourly so a scheduled send appears on the blog within about
# an hour, with no one at the keyboard.
#
# There is no human review step: the post is machine-assembled from the email
# template (see _posts/PUBLISHING.md). Two things keep that safe. A parse that
# does not cleanly recognize the four tool cards raises and commits NOTHING
# (so a malformed issue never publishes a broken post), and blog-sync-check.yml
# opens a tracking issue if anything a send should have produced is still
# missing. Needs the MAILERLITE_API_KEY secret.

on:
  schedule:
    - cron: "0 * * * *"   # hourly, on the hour
  workflow_dispatch:        # allows a manual run

permissions:
  contents: write

concurrency:
  group: newsletter-to-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install beautifulsoup4 pillow

      - name: Build posts for any newly sent issues
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: python _tools/newsletter-to-blog.py

      - name: Commit and push anything new
        run: |
          git add _posts assets/blog _tools/section-images
          if git diff --cached --quiet; then
            echo "Blog already in sync; nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-publish blog posts from newly sent issues"
          # main can move under us between checkout and push; rebase and retry.
          for attempt in 1 2 3; do
            git push && break
            echo "push rejected (attempt $attempt); rebasing on origin/main"
            git pull --rebase origin main
          done
