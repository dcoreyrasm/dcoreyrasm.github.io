name: Airtable bulk import (manual)

# Loads a prepared CSV of Connecticut resources into the Village Notes base.
# Manual trigger only -- it never runs on a schedule.
#
# Runs here rather than from a laptop for the same reason the syncs do: the
# Airtable token lives in this repo's secrets and nothing outside Actions can
# read it.
#
# Writes to Airtable, so it uses AIRTABLE_WRITE_TOKEN rather than the
# AIRTABLE_TOKEN the scheduled syncs carry. That separation is the point: the
# token running unattended every six hours can be read-only, and the one that
# can change 738 records is only ever handed to a run somebody started.
#
# The importer is idempotent: every row is keyed on its licence/registry id and
# checked against the table first, so re-running adds nothing. Start with
# dry_run to see the plan before writing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without writing anything"
        type: boolean
        default: true
      status:
        description: "Moderation Status for imported rows"
        type: choice
        options: ["Published", "Pending Review"]
        default: "Pending Review"

permissions:
  contents: read

concurrency:
  group: airtable-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The two manual writers use their own credential, so the token the
      # scheduled syncs carry can stay read-only. Without this step a missing
      # secret surfaces as "AIRTABLE_TOKEN is not set", which is true but says
      # nothing about which secret or why there are two.
      - name: Check the write token exists
        env:
          WRITE_TOKEN: ${{ secrets.AIRTABLE_WRITE_TOKEN }}
        run: |
          if [ -z "$WRITE_TOKEN" ]; then
            echo "::error::AIRTABLE_WRITE_TOKEN is not set."
            echo "This workflow writes to Airtable, so it deliberately does not use"
            echo "AIRTABLE_TOKEN -- that secret is read-only and is what the scheduled"
            echo "syncs carry every six hours."
            echo ""
            echo "Create a second Airtable personal access token with data.records:write"
            echo "on the Village Notes base, then add it to this repository as the secret"
            echo "AIRTABLE_WRITE_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Import
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_WRITE_TOKEN }}
        run: |
          python3 scripts/import-early-start-ct.py \
            --status "${{ inputs.status }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
