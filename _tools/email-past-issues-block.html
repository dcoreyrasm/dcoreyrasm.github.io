<!-- Past issues -->
<!--
  Durable copy of the "Past issues" block that lives in the newsletter skill's
  assets/issue-template.html (the skill cache can be wiped by a plugin re-sync;
  this repo copy is the source of truth). It sits between the "Try this"
  callout and the "Share / grow" block.

  Fill {{PAST_ISSUES}} with:
      python _tools/past-issues-email.py --exclude YYYY-MM-DD
  where the date is the issue being sent, so it does not list itself.
-->

<tr>

<div class="t-muted" style="font-family:'DM Sans',Helvetica,Arial,sans-serif; font-weight:300; font-size:13px; line-height:1.5; color:#5d5775; padding-bottom:4px;">By month, then by the week each one went out.</div>
{{PAST_ISSUES}}

</td>
